services:
    sc_back:
        build:
            context: .
            dockerfile: docker/8.4/Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        container_name: SC_Back
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - '.:/var/www/html'
            - '${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            APP_ENV: '${APP_ENV:-local}'
            APP_DEBUG: '${APP_DEBUG:-true}'
            DB_HOST: pgsql
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            SSH_AUTH_SOCK: /ssh-agent
        depends_on:
            pgsql:
                condition: service_healthy
        networks:
            - scback

    pgsql:
        image: 'postgres:17'
        container_name: SC_Postgres
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'scback-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - scback
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            interval: 5s
            timeout: 5s
            retries: 3
            start_period: 10s

    sc_front:
        build:
            context: ../Safe-Campus-front
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        container_name: SC_Front
        ports:
            - '3000:3000'
            - '24678:24678'
        volumes:
            - '../Safe-Campus-front:/app'
        environment:
            NUXT_PUBLIC_API_BASE: '${NUXT_PUBLIC_API_BASE:-http://localhost:8000}'
        depends_on:
            - sc_back
        networks:
            - scback

    adminer:
        image: 'adminer:latest'
        container_name: SC_Adminer
        ports:
            - '${ADMINER_PORT:-8080}:8080'
        depends_on:
            pgsql:
                condition: service_healthy
        networks:
            - scback

networks:
    scback:
        driver: bridge

volumes:
    scback-pgsql:
        driver: local
