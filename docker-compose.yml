services:
    sc_back:
        build:
            context: .
            dockerfile: docker/8.4/Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        container_name: SC_Back
        ports:
            - '${APP_PORT:-8000}:8000'
        volumes:
            - '.:/var/www/html'
            - '${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            DB_HOST: pgsql
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            SSH_AUTH_SOCK: /ssh-agent
        depends_on:
            pgsql:
                condition: service_healthy
        networks:
            - sail

    pgsql:
        image: 'postgres:17'
        container_name: SC_Postgres
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            interval: 5s
            timeout: 5s
            retries: 3
            start_period: 10s

    sc_front:
        build:
            context: ../Safe-Campus-front
            dockerfile: Dockerfile
        container_name: SC_Front
        ports:
            - '${FRONT_PORT:-3000}:3000'
        volumes:
            - '../Safe-Campus-front:/app'
            - 'sc_front_node_modules:/app/node_modules'
        environment:
            NODE_ENV: development
            NUXT_PUBLIC_API_BASE: 'http://sc_back:80'
        networks:
            - sail

    adminer:
        image: 'adminer:latest'
        container_name: SC_Adminer
        ports:
            - '${ADMINER_PORT:-8080}:8080'
        depends_on:
            pgsql:
                condition: service_healthy
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sc_front_node_modules:
        driver: local
